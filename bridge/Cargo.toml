[package]
name = "quietpanel-bridge"
version = "8.1.6"
edition = "2021"

[[bin]]
name = "QuietPanelBridge"
path = "src/main.rs"

[features]
default = ["wifi"]
wifi = []
adb = []

[dependencies]
serde_json = "1.0"
sysinfo = "0.30"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Shutdown",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Devices_Communication",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
